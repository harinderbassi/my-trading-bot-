name: Paper Trading Bot

on:
  schedule:
    - cron: '*/15 * * * *'   # runs automatically every 15 minutes, all day, every day
  workflow_dispatch:          # lets you also click "Run workflow" on GitHub to trigger it by hand

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check price and maybe trade
        run: python paper_trading_bot.py --once

      - name: Save results back to the repository
        run: |
          git config user.name "trading-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json trades.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "bot update"
          git push
